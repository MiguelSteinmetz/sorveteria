server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root @@APP_HOME@@/current/frontend;
    index index.html;
    server_tokens off;

    # API permanece no mesmo host público; Spring escuta apenas localhost:8080.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(swagger-ui|v3/api-docs|actuator)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de assets versionados; index.html não deve ficar preso em cache.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # Rotas Angular (SPA) retornam index.html; arquivos inexistentes não viram 200.
    location / { try_files $uri $uri/ /index.html; }
}
