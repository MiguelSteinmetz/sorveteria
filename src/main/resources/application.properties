spring.application.name=sorveteria

# Carrega variaveis de um arquivo .env na raiz do projeto, se existir.
# O .env NAO vai para o Git (veja .env.example).
spring.config.import=optional:file:.env[.properties]

# Mostra a mensagem de erro no corpo da resposta (ex.: "Produto nao encontrado com id 2")
spring.web.error.include-message=always

# PostgreSQL (credenciais somente por variavel de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none

# Mostrar SQL no console (ligue com SHOW_SQL=true quando precisar)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
# JWT_SECRET: no minimo 32 caracteres. Gere com: openssl rand -base64 48
api.security.jwt.secret=${JWT_SECRET}
api.security.jwt.expiration=${JWT_EXPIRATION:2h}
api.security.jwt.issuer=api-sorveteria

# Origens liberadas no CORS (front Angular). Separe por virgula.
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Usuario GERENTE criado na primeira execucao, se a tabela de usuarios estiver vazia.
api.admin.login=${ADMIN_LOGIN:}
api.admin.senha=${ADMIN_PASSWORD:}
