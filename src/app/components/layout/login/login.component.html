<div class="container">
    <div class="row topo">
        <div class="col-lg-4"></div>
        <div class="col-lg-4">
            <div class="card centralizar">
                <div class="card-body">
                    <h5 class="card-title mb-3">Autenticação-Sorveteria</h5>
                    <form (ngSubmit)="logar()">
                        <mdb-form-control>
                            <input mdbInput type="text" id="usuario" name="usuario" class="form-control mb-3" [(ngModel)]="usuario" autocomplete="username"/>
                            <label mdbLabel class="form-label" for="usuario">Usuário</label>
                        </mdb-form-control>
                        <mdb-form-control>
                            <input mdbInput type="password" id="senha" name="senha" class="form-control mb-3" [(ngModel)]="senha" autocomplete="current-password"/>
                            <label mdbLabel class="form-label" for="senha">Senha</label>
                        </mdb-form-control>
                        <button type="submit" class="btn btn-primary w-100" [disabled]="carregando">
                            {{ carregando ? 'Entrando...' : 'Entrar' }}
                        </button>
                    </form>
                    <p class="mt-3 mb-0">Não tem conta? <a routerLink="/cadastro">Cadastre-se</a></p>
                </div>
            </div>
        </div>
        <div class="col-lg-4"></div>
    </div>
</div>
