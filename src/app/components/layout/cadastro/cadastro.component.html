<div class="container">
    <div class="row topo">
        <div class="col-lg-4"></div>
        <div class="col-lg-4">
            <div class="card centralizar">
                <div class="card-body">
                    <h5 class="card-title mb-3">Criar conta</h5>
                    <form (ngSubmit)="cadastrar()">
                        <mdb-form-control>
                            <input mdbInput type="text" id="nome" name="nome" class="form-control mb-3" [(ngModel)]="dados.nome"/>
                            <label mdbLabel class="form-label" for="nome">Nome</label>
                        </mdb-form-control>
                        <mdb-form-control>
                            <input mdbInput type="text" id="login" name="login" class="form-control mb-3" [(ngModel)]="dados.login" autocomplete="username"/>
                            <label mdbLabel class="form-label" for="login">Usuário</label>
                        </mdb-form-control>
                        <mdb-form-control>
                            <input mdbInput type="password" id="senha" name="senha" class="form-control mb-3" [(ngModel)]="dados.senha" autocomplete="new-password"/>
                            <label mdbLabel class="form-label" for="senha">Senha (mínimo 6 caracteres)</label>
                        </mdb-form-control>
                        <mdb-form-control>
                            <input mdbInput type="password" id="confirmacao" name="confirmacao" class="form-control mb-3" [(ngModel)]="confirmacao" autocomplete="new-password"/>
                            <label mdbLabel class="form-label" for="confirmacao">Confirme a senha</label>
                        </mdb-form-control>
                        <mdb-form-control>
                            <input mdbInput type="text" id="cep" name="cep" class="form-control mb-3" maxlength="9" [(ngModel)]="dados.cep"/>
                            <label mdbLabel class="form-label" for="cep">CEP</label>
                        </mdb-form-control>
                        <button type="submit" class="btn btn-primary w-100" [disabled]="carregando">
                            {{ carregando ? 'Cadastrando...' : 'Cadastrar' }}
                        </button>
                    </form>
                    <p class="mt-3 mb-0">Já tem conta? <a routerLink="/login">Entrar</a></p>
                </div>
            </div>
        </div>
        <div class="col-lg-4"></div>
    </div>
</div>
